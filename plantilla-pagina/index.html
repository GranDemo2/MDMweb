<!DOCTYPE html>
<!-- ============================================================
     PLANTILLA DE PÁGINA NUEVA — Miguel De Mora · Filmmaker
     Para crear una página nueva (p. ej. "Trabajos" o "Clientes"):
     1) Copia esta carpeta y renómbrala con un nombre corto sin
        espacios (p. ej. "trabajos" o "clientes").
     2) Cambia el <title>, la <meta description> y la palabra de la
        cabecera (la <span class="word">).
     3) Dentro de <main>, pon tu contenido (bloques .svc, .about,
        .qr … como en studio.html / sobre-mi.html / contacto.html).
     4) Deja el botón "Volver al inicio" y el pie de página.
     Si prefieres páginas sueltas (sin carpeta), copia una de las
     páginas actuales (p. ej. sobre-mi.html), renómbrala y cambia el
     texto. Mismas reglas. Ver el COMO-EDITAR.md de la portada.
     ============================================================ -->
<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página nueva — Miguel De Mora</title>

          <span class="line"></span>
          <span class="word">Página nueva</span>
          <span class="line"></span>
        </div>
        <p class="lede">Una frase corta de presentación de esta página.</p>

    </div>

        <a class="back-link" href="../index.html">

    </div>

  <footer id="footer">
